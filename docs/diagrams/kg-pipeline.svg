        <rect x="488" y="208" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.10"/>
        <text x="495" y="216" fill="#2d3142" font-size="6" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">VER</text>
        <text x="534" y="230" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">构建产物</text>
        <text x="534" y="244" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">index_version</text>
