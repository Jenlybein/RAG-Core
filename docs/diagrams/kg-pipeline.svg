        <!-- step header chips -->
        <rect x="188" y="8" width="20" height="16" rx="8" fill="#2d3142" fill-opacity="0.12"/>
        <text x="198" y="19" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" font-weight="500">01</text>
