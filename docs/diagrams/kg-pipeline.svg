<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 840 436" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kg-pipeline-title kg-pipeline-desc" id="kg-pipeline-root">
        <title id="kg-pipeline-title">实体关系图的端到端流水线</title>
        <desc id="kg-pipeline-desc">文档从接入面上传后，由索引链路解析切块，在同一次模型调用里抽出节说明与实体关系，写入构建产物；检索链路读生效版本，跑三路召回到折叠；全局概览是一个独立端点。</desc>
        <defs>
      <style>#kg-pipeline-root { --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:  'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace; }
      #kg-pipeline-root { font-family: var(--font-sans); color: var(--color-ink); }
      #kg-pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#kg-pipeline-root .diagram-container { overflow-x: visible; }
}</style>
          <pattern id="kg-pipeline-kgp-dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
          </pattern>
          <marker id="kg-pipeline-kgp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="kg-pipeline-kgp-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#kg-pipeline-kgp-dots)" opacity="0.55"/>

        <!-- lane tints (lanes 0 and 2) -->
        <rect x="140" y="36" width="700" height="80" fill="#2d3142" fill-opacity="0.018"/>
        <rect x="140" y="196" width="700" height="80" fill="#2d3142" fill-opacity="0.018"/>

        <!-- lane dividers + label column divider -->
        <line x1="0" y1="36" x2="840" y2="36" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="0" y1="116" x2="840" y2="116" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
        <line x1="0" y1="196" x2="840" y2="196" stroke="#2d3142" stroke-width="0.8" stroke-opacity="0.12"/>
