<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>实体召回与一跳</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:  'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 960px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
               letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Dependency · RAG-Core</p>
    <h1>实体这一路是怎么汇进同一份结果的</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kg-hop-title kg-hop-desc">
        <title id="kg-hop-title">实体召回与一跳</title>
        <desc id="kg-hop-desc">用户问句经别名表确定性匹配认出实体后，与向量通道、关键词通道一起形成三路召回；只有度数不小于二的实体才向外扩一跳，最终三路扇入同一个融合步骤。</desc>
        <defs>
          <marker id="kgh-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ARROWS first -->
        <line x1="400" y1="116" x2="400" y2="180" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgh-arrow)"/>
        <path d="M 360,236 V 272 Q 360,280 352,280 H 168 Q 160,280 160,288 V 300" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgh-arrow)"/>
        <line x1="400" y1="236" x2="400" y2="300" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgh-arrow)"/>
        <path d="M 440,236 V 272 Q 440,280 448,280 H 632 Q 640,280 640,288 V 300" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgh-arrow)"/>
        <line x1="640" y1="356" x2="640" y2="420" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgh-arrow)"/>
        <line x1="560" y1="448" x2="480" y2="448" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgh-arrow)"/>
        <path d="M 160,356 V 440 Q 160,448 168,448 H 320" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgh-arrow)"/>
        <line x1="400" y1="356" x2="400" y2="420" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgh-arrow)"/>

        <!-- RANK 0: 问句 -->
        <rect x="320" y="60" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="60" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="436" y="66" width="36" height="12" rx="2" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="454" y="75" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1 in</text>
        <text x="400" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">用户问句</text>
        <text x="400" y="102" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">query</text>

        <!-- RANK 1: 别名匹配 -->
        <rect x="320" y="180" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="180" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="436" y="186" width="36" height="12" rx="2" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="454" y="195" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1 in</text>
        <text x="400" y="206" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">别名匹配</text>
        <text x="400" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">alias-table · 0 model call</text>

        <!-- RANK 2: 向量通道 -->
        <rect x="80" y="300" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="80" y="300" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="196" y="306" width="36" height="12" rx="2" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="214" y="315" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1 in</text>
        <text x="160" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">向量通道</text>
        <text x="160" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dense</text>

        <!-- RANK 2: 关键词通道 -->
        <rect x="320" y="300" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="300" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="436" y="306" width="36" height="12" rx="2" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="454" y="315" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1 in</text>
        <text x="400" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">关键词通道</text>
        <text x="400" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">bm25</text>

        <!-- RANK 2: 实体召回 -->
        <rect x="560" y="300" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="300" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="676" y="306" width="36" height="12" rx="2" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="694" y="315" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1 in</text>
        <text x="640" y="326" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">实体召回</text>
        <text x="640" y="342" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">entity index</text>

        <!-- RANK 3: 一跳 -->
        <rect x="560" y="420" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="560" y="420" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="676" y="426" width="36" height="12" rx="2" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="694" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">1 in</text>
        <text x="640" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">一跳扩展</text>
        <text x="640" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">hop · degree &gt;= 2 only</text>

        <!-- RANK 3: RRF 融合 (leaf) -->
        <rect x="320" y="420" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="320" y="420" width="160" height="56" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <rect x="436" y="426" width="36" height="12" rx="2" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="454" y="435" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3 in</text>
        <text x="400" y="446" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">RRF 融合</text>
        <text x="400" y="462" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">rrf → rerank → topk</text>

        <!-- LEGEND -->
        <line x1="40" y1="492" x2="920" y2="492" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="512" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="144" y="500" width="36" height="12" rx="2" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="162" y="509" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">3 in</text>
        <text x="192" y="512" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">扇入：有几路汇到这里</text>
        <line x1="404" y1="507" x2="436" y2="507" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgh-arrow)"/>
        <text x="444" y="512" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">依赖方向</text>
        <text x="600" y="512" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">孤点不扩：只参与名字召回</text>
      </svg>
    </div>
  </div>
</body>
</html>
