<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>构建版本的状态流转</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f5f5f5;
      --color-ink:    #2d3142;
      --color-muted:  #4f5d75;
      --color-accent: #bf4520;
      --font-sans:  'Geist', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Geist Mono', 'Noto Sans Mono CJK SC', ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 960px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500;
               letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400;
         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · RAG-Core</p>
    <h1>一次构建活着走完的一生</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 456" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="kg-state-flow-title kg-state-flow-desc">
        <title id="kg-state-flow-title">构建版本的状态流转</title>
        <desc id="kg-state-flow-desc">构建版本从构建中出发，四项计数相等后进入就绪，单事务激活后生效；新版本上线时旧版本归档，任一步失败则落到失败态；检索期只读生效版本。</desc>
        <defs>
          <marker id="kgsf-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="kgsf-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ARROWS first -->
        <line x1="26" y1="196" x2="48" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgsf-arrow)"/>
        <line x1="204" y1="196" x2="280" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgsf-arrow)"/>
        <line x1="436" y1="196" x2="512" y2="196" stroke="#bf4520" stroke-width="1.2" marker-end="url(#kgsf-arrow-accent)"/>
        <line x1="668" y1="196" x2="744" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgsf-arrow)"/>
        <line x1="126" y1="232" x2="126" y2="316" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgsf-arrow)"/>
        <line x1="590" y1="232" x2="590" y2="316" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#kgsf-arrow)"/>
        <line x1="900" y1="196" x2="916" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#kgsf-arrow)"/>

        <!-- transition labels: horizontal (mask 6px above the stroke) -->
        <rect x="214" y="174" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="242" y="186" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">计数相等</text>
        <rect x="446" y="174" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="474" y="186" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">激活切换</text>
        <rect x="678" y="174" width="56" height="16" rx="2" fill="#f5f5f5"/>
        <text x="706" y="186" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">归档旧版</text>

        <!-- transition labels: vertical (beside the stroke, 6px gap) -->
        <rect x="132" y="262" width="68" height="16" rx="2" fill="#f5f5f5"/>
        <text x="136" y="274" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">任一步失败</text>
        <rect x="596" y="262" width="80" height="16" rx="2" fill="#f5f5f5"/>
        <text x="600" y="274" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">只读，不迁移</text>

        <!-- START dot -->
        <circle cx="20" cy="196" r="6" fill="#2d3142"/>

        <!-- END ring (after 归档) -->
        <circle cx="924" cy="196" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="924" cy="196" r="5" fill="#2d3142"/>

        <!-- STATE: 构建中 -->
        <rect x="48" y="160" width="156" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="48" y="160" width="156" height="72" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <text x="126" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">构建中</text>
        <text x="126" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">building</text>

        <!-- STATE: 就绪 -->
        <rect x="280" y="160" width="156" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="280" y="160" width="156" height="72" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <text x="358" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">就绪</text>
        <text x="358" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">ready</text>

        <!-- STATE: 生效 (FOCAL) -->
        <rect x="512" y="160" width="156" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="512" y="160" width="156" height="72" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="590" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">生效</text>
        <text x="590" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">active</text>

        <!-- STATE: 归档 -->
        <rect x="744" y="160" width="156" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="744" y="160" width="156" height="72" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <text x="822" y="190" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">归档</text>
        <text x="822" y="208" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">archived</text>

        <!-- STATE: 失败 -->
        <rect x="48" y="316" width="156" height="72" rx="8" fill="#f5f5f5"/>
        <rect x="48" y="316" width="156" height="72" rx="8" fill="#ffffff" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
        <text x="126" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">失败</text>
        <text x="126" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">failed</text>

        <!-- NODE: 检索期 (reads active) -->
        <rect x="512" y="316" width="156" height="72" rx="6" fill="#f5f5f5"/>
        <rect x="512" y="316" width="156" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
        <text x="590" y="346" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif" text-anchor="middle">检索期</text>
        <text x="590" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">read only · pinned</text>

        <!-- LEGEND -->
        <line x1="40" y1="404" x2="920" y2="404" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="40" y="424" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="144" y="412" width="16" height="14" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="168" y="424" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">设计焦点：一次调用只读这一个版本</text>
        <circle cx="452" cy="419" r="8" fill="none" stroke="#2d3142" stroke-width="1.2"/>
        <circle cx="452" cy="419" r="5" fill="#2d3142"/>
        <text x="468" y="424" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">终止态</text>
        <line x1="576" y1="419" x2="608" y2="419" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4"/>
        <text x="616" y="424" fill="#5a6580" font-size="12" font-weight="500" font-family="'Geist','PingFang SC','Noto Sans SC','Microsoft YaHei',sans-serif">虚线表示只读引用，不是状态迁移</text>
      </svg>
    </div>
  </div>
</body>
</html>
