<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0891b2"/>
    </marker>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="900" height="620" fill="#ffffff"/>

  <!-- ⑨ 前端 -->
  <rect x="130" y="18" width="250" height="56" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="255" y="41" font-size="12.5" font-weight="700" fill="#334155" text-anchor="middle">⑨ 前端调试台</text>
  <text x="255" y="60" font-size="10.5" fill="#475569" text-anchor="middle">Vue 3 · 3 个页面</text>
  <line x1="255" y1="74" x2="255" y2="88" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- ① API 接入 -->
  <rect x="130" y="90" width="560" height="62" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="148" y="113" font-size="12.5" font-weight="700" fill="#1d4ed8">① API 接入　app/api/</text>
  <text x="148" y="134" font-size="11" fill="#334155">router 聚合三组路由　·　deps 注入 tenant　·　schemas 校验入参出参　·　不含业务</text>

  <line x1="410" y1="152" x2="410" y2="180" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- ③ Service -->
  <rect x="130" y="182" width="560" height="88" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="148" y="205" font-size="12.5" font-weight="700" fill="#15803d">③ 业务编排 Service　app/services/</text>
  <text x="148" y="226" font-size="11" fill="#334155">文档处理编排　·　检索编排　·　Research 编排（Planner / Decider / Finalizer）</text>
  <text x="148" y="247" font-size="11" fill="#334155">只描述「先做什么再做什么」，不碰 SQL、不关心哪家模型</text>

  <!-- ③ 分叉到 ④ ⑤ -->
  <line x1="410" y1="270" x2="410" y2="282" stroke="#475569" stroke-width="1.5"/>
  <line x1="265" y1="282" x2="555" y2="282" stroke="#475569" stroke-width="1.5"/>
  <line x1="265" y1="282" x2="265" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="555" y1="282" x2="555" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- ④ Repository -->
  <rect x="130" y="302" width="270" height="82" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="146" y="325" font-size="12.5" font-weight="700" fill="#86198f">④ 数据访问 Repository</text>
  <text x="146" y="346" font-size="10.5" fill="#334155">唯一数据库出口</text>
  <text x="146" y="365" font-size="10.5" fill="#334155">方法签名必带 tenant_id，没有裸查询</text>

  <!-- ⑤ Provider -->
  <rect x="420" y="302" width="270" height="82" rx="8" fill="#fdf4ff" stroke="#a21caf" stroke-width="1.5"/>
  <text x="436" y="325" font-size="12.5" font-weight="700" fill="#86198f">⑤ 外部适配 Provider</text>
  <text x="436" y="346" font-size="10.5" fill="#334155">七个子类：embedding / 向量库 / 关键词 /</text>
  <text x="436" y="365" font-size="10.5" fill="#334155">大模型 / 精排 / 解析 / 改写</text>

  <!-- ④⑤ → ⑦ -->
  <line x1="265" y1="384" x2="265" y2="416" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="555" y1="384" x2="555" y2="416" stroke="#475569" stroke-width="1.5" marker-end="url(#a1)"/>

  <!-- ⑦ 存储 -->
  <rect x="130" y="418" width="560" height="70" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="148" y="441" font-size="12.5" font-weight="700" fill="#6d28d9">⑦ 存储　PostgreSQL+pgvector　·　Elasticsearch+IK　·　Redis　·　本地磁盘</text>
  <text x="148" y="462" font-size="10.5" fill="#475569">索引时双写两者（失败即索引失败）；检索时并行读 + RRF 融合，单边挂了降级</text>

  <!-- ② 平台管控：横切竖条 -->
  <rect x="30" y="90" width="72" height="398" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="66" y="106" font-size="11.5" font-weight="700" fill="#b45309" writing-mode="vertical-rl" text-anchor="start" letter-spacing="1">② 平台管控 · 横切四层</text>
  <text x="43" y="200" font-size="10" fill="#92400e" writing-mode="vertical-rl" text-anchor="start" letter-spacing="1">鉴权 · 隔离 · 门禁 · 限流</text>

  <!-- ⑥ 异步任务 -->
  <rect x="714" y="182" width="164" height="202" rx="8" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="796" y="206" font-size="12.5" font-weight="700" fill="#0e7490" text-anchor="middle">⑥ 异步任务</text>
  <text x="796" y="225" font-size="10.5" fill="#155e75" text-anchor="middle">Celery Worker</text>
  <text x="728" y="252" font-size="10.5" fill="#334155">独立进程，独立 Session</text>
  <text x="728" y="273" font-size="10.5" fill="#334155">解析 → 切块</text>
  <text x="728" y="292" font-size="10.5" fill="#334155">→ 向量化 → 双写</text>
  <text x="728" y="318" font-size="10.5" fill="#334155">维护文档状态机</text>
  <text x="728" y="338" font-size="10.5" fill="#334155">3 处理中 / 1 成功 / 2 失败</text>
  <text x="728" y="364" font-size="10" fill="#0e7490">复用 ③ 的 Service，不重写业务</text>
  <line x1="714" y1="226" x2="694" y2="226" stroke="#0891b2" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- ⑧ 观测：旁路 -->
  <rect x="130" y="512" width="560" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="148" y="535" font-size="12.5" font-weight="700" fill="#475569">⑧ 观测（旁路）</text>
  <text x="148" y="556" font-size="10.5" fill="#334155">Langfuse 三阶段 span　·　用户 1~5 分反馈　·　RAGAS 离线评测　—　挂了不影响主流程</text>
  <line x1="410" y1="488" x2="410" y2="508" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#a3)"/>
  <text x="420" y="503" font-size="9.5" fill="#94a3b8">emit span（异常只记日志）</text>
</svg>
