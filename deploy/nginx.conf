# 前端容器：静态资源 + 两条反代，与 frontend/vite.config.ts 的开发代理逐条对应。
#
#   /api/     → 数据面（Bearer 身份）
#   /console/ → 控制面（会话 cookie，Path=/console）
#
# 两条都反代到同一个 API 容器：浏览器眼里它们是**同一个 origin**，这正是控制面 cookie
# 与防跨站头能生效的前提。跨源要动 SameSite 与 CORS，本步明确不做。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── 上游必须**每次现解析**，不能只在启动时解析一次 ────────────────────────────
    # 静态写法（``proxy_pass http://api:8000``）里的主机名在**配置加载时**解析一次，
    # 之后 IP 就焊死了。`docker compose up --build api` 会重建容器、换一个 IP，于是
    # 控制台立刻全站 502——而 API 自己好好的（直连 8000 一切正常）。现象是登录页报
    # 「后端连不上」，实际是 nginx 还在往一个已经不存在的地址发请求。
    #
    # 修法：把上游放进变量，配合 Docker 内嵌 DNS 现解析。``127.0.0.11`` 是 compose
    # 自建网络里的解析器；``valid=10s`` 让它 10 秒重解析一次（踩过之后的新 IP 也能自愈），
    # ``ipv6=off`` 是因为服务名会同时返回 AAAA，而容器网络里连不上。
    #
    # 注意 ``proxy_pass $变量`` 的行为：值里不带 URI，nginx 就把**原请求 URI 原样**转发，
    # 与静态写法逐字节一致——这不是「改转发路径」，只是改解析时机。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    # 单页应用：静态文件找不到就回 index.html，让 vue-router 去匹配。
    # 没有这条时，直接刷新 /traces 会得到 nginx 的 404——而路由本身是好的。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存；index.html 不缓存，否则发版后浏览器还拿旧的入口。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 检索要等嵌入与重排，默认 60s 会切掉长请求。
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /console/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
