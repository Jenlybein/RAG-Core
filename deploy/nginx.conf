# 前端容器：静态资源 + 两条反代，与 frontend/vite.config.ts 的开发代理逐条对应。
#
#   /api/     → 数据面（Bearer 身份）
#   /console/ → 控制面（会话 cookie，Path=/console）
#
# 两条都反代到同一个 API 容器：浏览器眼里它们是**同一个 origin**，这正是控制面 cookie
# 与防跨站头能生效的前提。跨源要动 SameSite 与 CORS，本步明确不做。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 单页应用：静态文件找不到就回 index.html，让 vue-router 去匹配。
    # 没有这条时，直接刷新 /traces 会得到 nginx 的 404——而路由本身是好的。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存；index.html 不缓存，否则发版后浏览器还拿旧的入口。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 检索要等嵌入与重排，默认 60s 会切掉长请求。
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location /console/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
