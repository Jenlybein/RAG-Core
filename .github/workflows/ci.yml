name: CI

on:
  push:
  pull_request:
    # labeled：给 PR 打上 run-ocr 标签时重新触发，OCR job 才会被选中。
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

# 三个 Python job 都必须显式钉 Python 3.12：runner 默认的 `python3` 会一路升到 3.14，
# 而 psycopg-binary 3.2.3 只有 cp312/cp313 的 wheel，uv 会以
# "doesn't have a source distribution or wheel for the current platform" 直接失败。
# `requires-python = ">=3.12"` 允许 3.14，光靠 pyproject 兜不住，必须在这里钉。
env:
  UV_PYTHON: "3.12"

jobs:
  quality:
    # 半离线：不装容器、不下载任何 OCR 资产（OCR 用例 skip）；但会取一次 2.56 MB 的
# Qwen 分词词表——切块按 token 计长，缺词表等于没有窗口口径。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        # 历史 Python 文件尚未按本工具链统一格式；本票只守住新增代码，
        # 待单独确认历史文件清单后再把检查范围扩回整个仓库。
        run: uv run ruff format --check tests
      - name: Type check
        run: uv run mypy app
      - name: Frozen eval assets
        # 守住 eval/corpus 与 eval/baseline 的内容指纹（#138 验收第 1 条 / 票 #156 接线）。
        # 往里加一篇文档、改一个字、删一个文件，都等于基线当场失效——那三件事在这里变成
        # 一条红的 CI，而不是「下次跑评测才发现分数对不上」。
        # 红的时候先想清楚为什么（换语料要重跑 baseline 并归档），再跑
        # `uv run python scripts/eval_refs.py freeze --write` 把清单一起提交，让变更留在历史里。
        run: uv run python scripts/eval_refs.py check-frozen
      - name: Fetch Qwen tokenizer vocab
        # 切块窗口按 Qwen token 计长，词表是必需资产（2.56 MB，带 SHA256 校验）。
        # 缺它所有切块用例都会失败，所以这一步放在 Test 之前。
        run: uv run python scripts/fetch_qwen_vocab.py

      - name: Test
        run: uv run pytest -q

  frontend:
    # 为什么单独一个 job：前端没有 Python 依赖（只要 Node + pnpm），混进 quality 会让
    # 每次只改 markdown、模板或前端样式的提交也装一遍 uv 与 Python 依赖；拆开后两个 job
    # 并行跑，前端红与后端红也各自看得见，不用在一长串步骤里找是哪一步挂的。
    # 版本对齐本机实测的 Node 22.23.2 / pnpm 12.5.1（前端 lockfile 由它生成）。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 不写 run_install：安装统一在下面那步显式跑，才能拿到 --frozen-lockfile。
          version: "12.5.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          # 锁文件在子目录里：不给这一行，setup-node 会去仓库根找 pnpm-lock.yaml 而缓存键落空。
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        # 依赖树完全按 lockfile 装：lockfile 漂移时宁可红，也不在 CI 里悄悄解析出新版本。
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: frontend
        # build 里含 `vue-tsc --noEmit`：类型错也让这条红，不留给运行时。
        run: pnpm build
      - name: Test
        working-directory: frontend
        run: pnpm test

  integration:
    # 真实 PostgreSQL 上的 CAS 集成用例：只在手工触发（workflow_dispatch）时跑，
    # 默认流水线保持离线。redis 容器按契约随附，留给后续真实 Broker 用例。
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Test integration
        env:
          RAG_INTEGRATION_DATABASE_URL: >-
            postgresql+psycopg://postgres:postgres@localhost:5432/rag_test
        run: uv run pytest -m integration -q

  ocr:
    # 独立 job：只有手工触发或 PR 带 run-ocr 标签时才跑，默认流水线保持离线。
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-ocr')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Cache OCR runtime assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ocr/pdfium
            ~/.cache/ocr/onnxruntime
            ~/.cache/ocr/models
          key: ocr-runtime-v7988-ort1270-oar07
      - name: Fetch OCR runtime (cache miss only)
        run: bash deploy/ocr/fetch_runtime.sh
      - name: Test
        env:
          PDFIUM_LIB_PATH: ${{ github.workspace }}/.ocr/lib/libpdfium.so
          ORT_DYLIB_PATH: ${{ github.workspace }}/.ocr/lib/libonnxruntime.so
          PDF_INSPECTOR_MODEL_CACHE: ${{ github.workspace }}/.ocr/models
        run: uv run pytest -m ocr -q
