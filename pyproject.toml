[project]
name = "rag-center"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # 阶段 1
    "fastapi==0.115.4",
    # 第 11 步票 6（#129）曾直接钉住 `anyio==4.16.0`：`app/core/sync_bridge.py` 用它把同步
    # 上下文里的协程交回主事件循环。票 #130 删掉了那个过渡桥（判定内核与写事务都已在事件
    # 循环上），直接 import 的包也就不该继续留在依赖表里——它仍是 starlette / fastapi 的
    # 传递依赖，运行期能力一点不变。守卫见 `tests/test_console_async_writes.py`。
    # 教程原值 0.32.0 → 0.35.0：fastmcp 3.0 要求 uvicorn>=0.35
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    # 教程原值 2.9.2 → 2.11.7：fastmcp 3.0 要求 pydantic>=2.11.7
    "pydantic==2.11.7",
    # 第 4 步票 1：2.6.0 → 2.16.2。langchain 1.x 的依赖链要求 pydantic-settings>=2.10.1，
    # 而 2.6.0 恰好卡在下面；它对 pydantic 的要求仍是 >=2.7，2.11.7 这条硬钉不受影响。
    "pydantic-settings==2.16.2",
    "psycopg[binary]==3.2.3",
    "pgvector==0.3.6",
    # 教程原值 0.27.2 → 0.28.1：fastmcp 要求 httpx>=0.28.1（0.28 起 proxies= 改名 proxy=）
    "httpx==0.28.1",
    # 阶段 3
    "python-multipart==0.0.9",
    "mammoth==1.8.0",
    "pdf-inspector==1.25.2",
    "markdownify==1.2.3",
    # HTML 解析器（第 4 步票 5）显式声明：bs4 本来就在环境里（markdownify 的依赖），
    # 但直接 import 的包必须自己钉住，否则 markdownify 换解析后端时会静默失效。
    "beautifulsoup4==4.15.0",
    # celery 5.4.0 的 redis extra 封顶 redis<6.0.0，而它允许的 kombu 窗口（<6.0）会解析到
    # kombu 5.7.0，后者要求 redis>=6.4.0 —— 三者不可能同时满足，真实投递时会在第一次
    # 建 channel 时报 kombu.exceptions.VersionMismatch。升到 5.5.3：它把 kombu 封在
    # <5.6，而 kombu 5.5.x 允许 redis<=5.2.1，于是 redis-py 5.2.0 继续可用。
    # 离线测试碰不到 broker，所以 tests/test_dependency_compat.py 专门守这条约束。
    "celery[redis]==5.5.3",
    "redis==5.2.0",
    # 阶段 4
    "elasticsearch==8.15.1",
    # 阶段 7
    # 票 100：2.57.0 → 5.2.0，跨大版本。5.x 把 SDK 换成 OpenTelemetry 底座（依赖表里
    # 会多出一串 opentelemetry-*）。装包本身的门槛只有 Python：它的元数据写着
    # Requires-Python >=3.11,<4.0，本仓库 requires-python >=3.12 已满足；配套服务端要
    # ≥4.59 是票面上的部署前提，离线测不出来。不升的代价是：2.x 的 trace/span 口径与
    # 5.x 是两套 API，埋点会照着就要消失的那套写。守大版本的测试见
    # tests/test_dependency_compat.py，防止有人无声降回 2.x。
    "langfuse==5.2.0",
    # 第 4 步票 1：评测库升到 0.4.3。ragas 0.2.6 拖着 langchain 0.2/0.3 时代的
    # langchain-community，与 langchain 1.x 不可能共存——这两半是同一次升级。
    "ragas==0.4.3",
    "datasets==4.8.5",
    # 第 4 步票 1（模型接入层）：LangChain 只住在大模型与嵌入两个 Provider 内部，
    # 检索层不套框架（ADR-0011）。langgraph 由 langchain 1.x 自己依赖，不单独声明。
    "langchain==1.4.9",
    "langchain-openai==1.7.4",
    "langchain-anthropic==1.7.10",
    "langchain-google-genai==3.2.0",
    # 第 4 步票 1：langchain-community 不是我们的直接依赖，是 ragas 0.4.3 拖进来的，
    # 但它必须钉在 0.4.1 —— ragas 的 ragas/llms/base.py 在模块顶层
    # `from langchain_community.chat_models.vertexai import ChatVertexAI`，
    # 而这个模块在 0.4.2 被删掉了，装最新版会让 `import ragas` 直接 ModuleNotFoundError。
    # 守卫测试见 tests/test_dependency_compat.py。
    "langchain-community==0.4.1",
    # 第 1 步（双入口骨架）
    # 必须钉 3.0.0：fastmcp 2.9 ~ 2.13 都没有 fastmcp.dependencies，
    # 也没有 fastmcp.utilities.lifespan.combine_lifespans，第 1 步挂载时会 import 失败。
    # 教程写的 "fastmcp>=2.9" 在今天解析不出来，且满足不了双入口骨架。
    "fastmcp==3.0.0",
    # 全程
    "pytest==8.3.3",
    # 第 11 步票 3（#126）：异步用例的入口。**strict 模式**（见 [tool.pytest.ini_options]）：
    # 只有显式标了 @pytest.mark.asyncio 的 async def 用例才会被跑，现有用 asyncio.run 的
    # 用例一条都不改写——批量改写是噪音，不是迁移。
    "pytest-asyncio==1.3.0",
    "structlog==26.1.0",
    "tiktoken==0.14.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pre-commit==4.7.0",
    "aiosqlite>=0.22.1",
]

# 根目录同时有 app 与 migrations 两个 Python 包时，setuptools 无法猜主包，
# 必须显式声明，否则 uv sync 报 Multiple top-level packages discovered in a flat-layout。
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*", "tests*", "eval*", "scripts*"]

[tool.ruff]
target-version = "py312"
line-length = 100

# 骨架期的 59 个历史文件尚未按本工具链统一风格；本票不批量重写。
# 只启用语法错误与 pyflakes 这类不会误伤历史写法的基础规则，
# 后续章节在单独确认后再逐步放宽规则集。
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
files = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# 第 11 步票 3（#126）：异步用例只在显式标记时运行（strict）。没标记的 async def 用例
# 会被静默跳过——这正是「忘了加标记」最容易被忽略的形态，所以模式写死在这里而不是靠默认值。
asyncio_mode = "strict"
# 异步夹具的循环作用域也写死：一个用例一个循环（与现有 ``asyncio.run`` 用例「一次一个
# 干净循环」的语义一致），不让它随 pytest-asyncio 的版本默认值漂移。
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ocr: requires PDFium + ONNX Runtime + PP-OCRv6 model assets (see deploy/ocr/fetch_runtime.sh)",
    "integration: requires a real PostgreSQL; set RAG_INTEGRATION_DATABASE_URL (see .github/workflows/ci.yml)",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
